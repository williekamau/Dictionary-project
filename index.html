<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple-english-dictionary</title>
</head>
<body>
     <h1>simplified dictionary</h1>

    <input
        type="text"
        id="wordInput"
        placeholder="Type the word"
    >

    <button id="searchButton">Search</button>

    <div id="results">
        <h2 id="word"></h2>
        <p id="pronunciation"></p>
        <p id="definition"></p>
        <p id="example"></p>
        <p id="audio-playback"></p>
    </div>
    
</body>
</html>
